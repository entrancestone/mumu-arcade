<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Color Match</title>
<style>
  html,body { margin:0; height:100%; background:#1f2a44; color:#fff; font-family:sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #target { font-size:22px; margin-bottom:20px; }
  #grid { display:grid; grid-template-columns:repeat(3,90px); gap:12px; }
  .tile { width:90px; height:90px; border-radius:10px; cursor:pointer; border:none; }
  #status { margin-top:20px; font-family:monospace; font-size:16px; color:#f2c230; }
  #note { font-size:13px; color:#c7b088; margin-top:6px; }
</style>
</head>
<body>
<div id="target">Tap the: <span id="color-name">red</span></div>
<div id="grid"></div>
<div id="status">Score: 0</div>
<div id="note">Placeholder game — swap in the real one.</div>
<script>
const colors = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
const hex = { red:'#e2543e', blue:'#3b6ea5', green:'#3d7a5c', yellow:'#f2c230', purple:'#7c5cbf', orange:'#e08a3e' };
let target = colors[0];
let score = 0;

function shuffle(arr) {
  return arr.slice().sort(() => Math.random() - 0.5);
}

function render() {
  target = colors[Math.floor(Math.random() * colors.length)];
  document.getElementById('color-name').textContent = target;
  document.getElementById('color-name').style.color = hex[target];

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  shuffle(colors).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.style.background = hex[c];
    btn.onclick = () => {
      if (c === target) {
        score++;
        document.getElementById('status').textContent = 'Score: ' + score;
        render();
      } else {
        document.getElementById('status').textContent = 'Miss! Score: ' + score;
      }
    };
    grid.appendChild(btn);
  });
}
render();
</script>
</body>
</html>
